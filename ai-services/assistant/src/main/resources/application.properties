server.address=127.0.0.1
server.port=8280
spring.application.name=zhx-assistant
spring.ai.openai.api-key=${ZHX_AI_KEY:unconfigured}
spring.ai.openai.base-url=${ZHX_AI_BASE:https://api.deepseek.com}
spring.ai.openai.chat.options.model=${ZHX_AI_MODEL:deepseek-chat}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=1500
spring.ai.openai.embedding.enabled=false
spring.ai.retry.max-attempts=1
spring.ai.mcp.client.name=zhx-assistant
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=20s
spring.ai.mcp.client.streamable-http.connections.business.url=${ZHX_MCP_URL:http://127.0.0.1:8180}
spring.ai.mcp.client.toolcallback.enabled=false
